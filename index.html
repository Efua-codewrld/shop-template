<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ARCHIVE - Editorial & Apparel</title>
        <link rel="stylesheet" href="style.css">
    </head>
    
    <body>
        
        <section class="hero-banner">
            <div class="hero-content">
                <h1 class="brand-title">ARCHIVE</h1>
                <a href="shop.html" class="shop-now-btn">Shop Now</a>
            </div>

        </section>
        <header class="sticky-nav">
            <nav class="tab-links">
                <a href="index.html" class="tab-item">Home</a>
                <a href="#catalogGrid"  class="tab-item">New Arrivals</a>
                <a href="shop.html"  class="tab-item">Shop</a>
                <a href="contact.html" class="tab-item">Contact</a>
                <a href="terms.html"  class="tab-item">Terms</a>

            </nav>
        
        </header>
        <h1>NEW ARRIVALS</h1>
        <section class="catalog-grid" id="catalogGrid">

        </section>

        <section class="subscription">
<!--existing image-->            
            <img src="images/image17.jpg" alt="editorial banner" class="banner-img">
<!--Card wrapper-->
            <div class="subscription-card">
                <form action="" method="POST">

                    <h2>Stay Updated</h2>
            <p class="card-subtitle">Subscribe to our latest updates</p>
            
                    <div class="formRow">

                    <div class="formGroup">
                        <label for="user-email">Email Address: </label>
                        <input type="email"  id="user-email" name="email"
                        placeholder="Enter your email address" required>
                    </div>

                    <div class="formGroup"><label for="userPhone">Phone Number</label>
                        <input type="tel" id="userPhone" name="tel" 
                        placeholder="Please enter whatsapp number" required>
                    </div>
                    <div><button type="submit" class="submit-btn">Subscribe</button>
                    </div>

                    </div>
                </form>
            </div>

        </section>

        
        <footer>
            &copy; 2026 ARCHIVE. ALL RIGHTS RESERVED.
        </footer>
        <script src="main.js"></script> 
    </body>
</html>
