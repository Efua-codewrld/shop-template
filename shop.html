<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ARCHIVE - Editorial & Apparel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="sticky-nav">
            <nav class="tab-links">
                <a href="index.html" class="tab-item">Home</a>
                <a href="#catalogGrid"  class="tab-item">New Arrivals</a>
                <a href="shop.html"  class="tab-item">Shop</a>
                <a href="contact.html" class="tab-item">Contact</a>
                <a href="terms.html"  class="tab-item">Terms</a>
                <button type="button" class="cart-trigger-btn"><svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="nav-cart-icon">
  <path stroke-linecap="round" stroke-linejoin="round" d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 0 0-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 0 0-16.536-1.84M7.5 14.25 5.106 5.272M6 20.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm12.75 0a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z" />
</svg>
<span class="cart-badge">0</span>
</button>
            </nav>
        </header>
        
<button id="mobileFilterToggle" class="mobile-toggle-btn">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
      <path stroke-linecap="round" stroke-linejoin="round" d="M12 3c2.755 0 5.455.232 8.083.678.533.09.917.556.917 1.096v1.044a2.25 2.25 0 0 1-.659 1.591l-5.432 5.432a2.25 2.25 0 0 0-.659 1.591v2.927a2.25 2.25 0 0 1-1.244 2.013L9.75 21v-6.568a2.25 2.25 0 0 0-.659-1.591L3.659 7.409A2.25 2.25 0 0 1 3 5.818V4.774c0-.54.384-1.006.917-1.096A48.32 48.32 0 0 1 12 3Z" />
    </svg>
</button>

<main class="shop-container">
<aside id="filterSidebar" class="filter-controls">
<h2>Filter & sort </h2>

 <!-- Live Text Search -->
<div class="filter-group">
<label for="searchBar">Search Items</label>
<div class="custom-dropdown-container">
<input type="text" id="searchBar" placeholder="Type to search">
</div>
</div>

 <!-- Custom Category Dropdown -->
 <div class="filter-group">
     <label>Category</label>
     <div class="custom-dropdown-container" id="categoryDropdownContainer">
         <button type="button" class="dropdown-trigger" id="categoryDropdownTrigger">
             <span id="selectedCategoryText">All Categories</span>
             <span class="arrow">▼</span>
         </button>
         <div class="dropdown-menu" id="categoryDropdownMenu">
             <div class="dropdown-item active" data-value="all">All Categories</div>
             <div class="dropdown-item" data-value="tops">Tops & Sweaters</div>
             <div class="dropdown-item" data-value="bottoms">Bottoms & Jorts</div>
             <div class="dropdown-item" data-value="bags">Bags & Accessories</div>
         </div>
     </div>
 </div>

<!-- Custom Price Sorter Dropdown -->
 <div class="filter-group">
     <label>Filter By Price</label>
     <div class="custom-dropdown-container" id="priceDropdownContainer">
         <button type="button" class="dropdown-trigger" id="priceDropdownTrigger">
             <span id="selectedPriceText">Featured</span>
             <span class="arrow">▼</span>
         </button>
         <div class="dropdown-menu" id="priceDropdownMenu">
             <div class="dropdown-item active" data-value="default">Featured</div>
             <div class="dropdown-item" data-value="low-high">Price: Low to High</div>
             <div class="dropdown-item" data-value="high-low">Price: High to Low</div>
         </div>
     </div>
 </div>
</aside>

<!-- 3. DYNAMIC PRODUCT GRID -->
<section class="catalog-section">
<div id="catalogGrid" class="catalog-grid">
<!-- JavaScript will inject cards here -->
</div>
</section>
</main>

<!--loading fuse.js from the web first-->
<script src="https://cdn.jsdelivr.net/npm/fuse.js@6.6.2/dist/fuse.min.js"></script>

<!-- Link your script file at the very bottom so the DOM elements are fully loaded -->
 <script src="shop_grid.js"></script>

  <footer>
            &copy; 2026 ARCHIVE. ALL RIGHTS RESERVED.
   </footer>
</body>
</html>
